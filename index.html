<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sorteio de músicas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F4EFFF;--ink:#231942;--muted:#6B6090;--card:#FFFFFF;--line:#DAD0F2;--accent:#E8365D;--on-accent:#FFFFFF;--disc:#231942;--disc-g:#3A2D63;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#150E28;--ink:#F1EAFF;--muted:#A89BCF;--card:#21173D;--line:#3A2D63;--accent:#FF6E8A;--on-accent:#1A0B1F;--disc:#0C0716;--disc-g:#2A1E4B}}
:root[data-theme="dark"]{--bg:#150E28;--ink:#F1EAFF;--muted:#A89BCF;--card:#21173D;--line:#3A2D63;--accent:#FF6E8A;--on-accent:#1A0B1F;--disc:#0C0716;--disc-g:#2A1E4B}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.4}
main{max-width:560px;margin:0 auto;padding:28px 20px 56px}
.stage{text-align:center;padding-top:8px}
.disc{width:min(62vw,240px);aspect-ratio:1;margin:0 auto 28px;border-radius:50%;position:relative;
background:repeating-radial-gradient(circle,var(--disc) 0 3px,var(--disc-g) 3px 4px);box-shadow:0 10px 0 -4px var(--line)}
.disc::after{content:"";position:absolute;inset:36%;border-radius:50%;background:var(--accent);box-shadow:0 0 0 6px var(--disc)}
.disc.spin{animation:spin .9s cubic-bezier(.2,.7,.2,1)}
@keyframes spin{from{transform:rotate(-540deg)}to{transform:rotate(0)}}
@media (prefers-reduced-motion:reduce){.disc.spin{animation:none}}
h1{font-size:clamp(30px,9vw,46px);line-height:1.05;font-weight:800;margin:0 0 8px;overflow-wrap:anywhere}
.artist{font-size:20px;color:var(--muted);margin:0 0 28px;min-height:1.4em}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
button,.btn{font:inherit;font-weight:500;border-radius:12px;border:2px solid var(--ink);background:transparent;color:var(--ink);padding:12px 18px;cursor:pointer;text-decoration:none;display:inline-block}
button.primary,.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
button:focus-visible,.btn:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button:disabled{opacity:.5;cursor:default}
.empty{color:var(--muted);font-size:18px}
.admin{margin-top:48px;border-top:2px solid var(--line);padding-top:24px}
.admin h2{font-size:22px;margin:0 0 4px}
.admin p.hint{color:var(--muted);margin:0 0 16px;font-size:15px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px}
.panel h3{margin:0 0 10px;font-size:17px}
label{display:block;font-size:14px;color:var(--muted);margin-bottom:6px}
input,textarea{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
textarea{min-height:130px;resize:vertical}
.qrbox{display:flex;flex-direction:column;align-items:center;gap:12px;margin-top:14px}
#qr{background:#fff;padding:12px;border-radius:10px;line-height:0}
#qr img,#qr canvas{max-width:100%;height:auto}
.list{max-height:320px;overflow-y:auto;margin:12px 0 0;padding:0;list-style:none;border-top:1px solid var(--line)}
.list li{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.list .t{flex:1;min-width:0;overflow-wrap:anywhere;font-size:15px}
.list .t small{color:var(--muted);display:block}
.list button{padding:6px 10px;font-size:14px;border-width:1px}
.bar{position:sticky;bottom:calc(8px + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 12px 10px 16px}
.bar button{border-color:var(--accent);background:var(--accent);color:var(--on-accent)}
.msg{font-size:14px;margin-top:8px;color:var(--muted)}
</style>
</head>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
(function(){
var state;try{state=JSON.parse(document.getElementById('data').textContent)}catch(e){state={songs:[],link:""}}
var songs=state.songs||[],link=state.link||"",dirty=false,current=-1,isAdmin=false,artifactNS=null,dlNS=null,msg="";
var app=document.getElementById('app');
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function rnd(n){var b=new Uint32Array(1),lim=Math.floor(4294967296/n)*n;do{crypto.getRandomValues(b)}while(b[0]>=lim);return b[0]%n}
function pick(){if(!songs.length){current=-1;return}var i=rnd(songs.length);if(songs.length>1){while(i===current)i=rnd(songs.length)}current=i}
function safeUrl(u){return/^https?:\/\//i.test(u||'')?u:''}
function render(spin){
var s=songs[current],h='<section class="stage"><div class="disc'+(spin?' spin':'')+'"></div>';
if(s){h+='<h1>'+esc(s.t)+'</h1><p class="artist">'+esc(s.a||'')+'</p><div class="row">';
if(safeUrl(s.u))h+='<a class="btn primary" href="'+esc(s.u)+'" target="_blank" rel="noopener">Abrir música</a>';
h+='<button id="again">Sortear outra</button></div>'}
else{h+='<p class="empty">Nenhuma música cadastrada ainda.</p>'}
h+='</section>';
if(isAdmin)h+=adminHtml();
app.innerHTML=h;
var ag=document.getElementById('again');if(ag)ag.onclick=function(){pick();render(true)};
if(isAdmin)bindAdmin();
}
function adminHtml(){
var h='<section class="admin"><h2>Gerenciar músicas</h2><p class="hint">Só você vê esta área. '+songs.length+' música'+(songs.length===1?'':'s')+' na lista.</p>';
h+='<div class="panel"><h3>Adicionar músicas</h3><label for="bulk">Uma por linha: Música - Artista | link (o link é opcional)</label><textarea id="bulk" placeholder="Evidências - Chitãozinho &amp; Xororó&#10;Garota de Ipanema - Tom Jobim | https://..."></textarea><div class="row" style="margin-top:10px;justify-content:flex-start"><button id="add" class="primary">Adicionar à lista</button></div></div>';
h+='<div class="panel"><h3>QR code</h3><label for="link">Link do site (copie o link compartilhado e cole aqui)</label><input id="link" type="url" inputmode="url" value="'+esc(link)+'" placeholder="https://claude.ai/..."><div class="qrbox"><div id="qr"></div><button id="dl" hidden>Baixar QR code</button></div></div>';
h+='<div class="panel"><h3>Lista</h3>'+(songs.length?'<ul class="list">'+songs.map(function(x,i){return'<li><div class="t">'+esc(x.t)+(x.a?'<small>'+esc(x.a)+'</small>':'')+'</div><button data-del="'+i+'" aria-label="Remover '+esc(x.t)+'">Remover</button></li>'}).join('')+'</ul>':'<p class="empty" style="font-size:15px">Ainda vazia.</p>')+'</div>';
h+='<div class="bar"><span>'+(dirty?'Alterações não salvas':'Tudo salvo')+(msg?' · '+esc(msg):'')+'</span><button id="save"'+(dirty?'':' disabled')+'>Salvar e publicar</button></div></section>';
return h}
function parse(txt){
return txt.split(/\r?\n/).map(function(l){l=l.trim();if(!l)return null;var u='',p=l.split('|');if(p.length>1){u=p.pop().trim();l=p.join('|').trim()}
var m=l.match(/^(.*?)\s+[-–—]\s+(.*)$/);return{t:m?m[1].trim():l,a:m?m[2].trim():'',u:safeUrl(u)}}).filter(Boolean)}
function drawQr(){
var box=document.getElementById('qr'),dl=document.getElementById('dl');if(!box)return;
box.innerHTML='';dl.hidden=true;
if(!link||!window.QRCode){box.style.display='none';return}
box.style.display='';
try{new QRCode(box,{text:link,width:220,height:220,correctLevel:QRCode.CorrectLevel.M});dl.hidden=!dlNS}catch(e){box.style.display='none'}}
function bindAdmin(){
document.getElementById('add').onclick=function(){
var t=document.getElementById('bulk').value,n=parse(t);if(!n.length)return;
songs=songs.concat(n);dirty=true;msg=n.length+' adicionada'+(n.length===1?'':'s');if(current<0)pick();render(false)};
document.getElementById('link').onchange=function(e){link=e.target.value.trim();dirty=true;render(false)};
Array.prototype.forEach.call(document.querySelectorAll('[data-del]'),function(b){b.onclick=function(){
var i=+b.getAttribute('data-del');songs.splice(i,1);dirty=true;msg='';if(current>=songs.length||current===i)pick();render(false)}});
document.getElementById('save').onclick=save;
document.getElementById('dl').onclick=function(){
var c=document.querySelector('#qr canvas');if(!c||!dlNS)return;
c.toBlob(function(b){dlNS.save({filename:'qrcode-sorteio.png',data:b}).catch(function(){})})};
drawQr()}
async function save(){
if(!artifactNS)return;
var btn=document.getElementById('save');btn.disabled=true;btn.textContent='Publicando…';
try{
var d=document.documentElement.cloneNode(true);
d.querySelector('#data').textContent=JSON.stringify({songs:songs,link:link}).replace(/</g,'\\u003c');
d.querySelector('#app').innerHTML='';
await artifactNS.publish('<!DOCTYPE html>\n'+d.outerHTML);
}catch(e){msg='não foi possível publicar';btn.disabled=false;btn.textContent='Salvar e publicar'}}
pick();render(true);
if(typeof claude!=='undefined'&&typeof claude.use==='function')Promise.all([claude.use('user'),claude.use('artifact'),claude.use('downloads')]).then(function(r){
var u=r[0];artifactNS=r[1];dlNS=r[2];
if(u&&artifactNS&&u.canEdit()){isAdmin=true;
if(!link&&/^https:\/\/claude\.ai\//.test(location.href)){link=location.href.split('#')[0]}
render(false)}}).catch(function(){});
})();
</script>
